<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oreonet Website</title>
    <style>
        /* Force styling overrides to ignore GitHub defaults */
        html, body {
            margin: 0 !important;
            padding: 0 !important;
            width: 100%;
            height: 100%;
        }
        body {
            /* Links your background image file */
            background-image: url('bg.png') !important;
            background-size: cover !important;
            background-position: center center !important;
            background-repeat: no-repeat !important;
            background-attachment: fixed !important;
            font-family: Arial, sans-serif;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative; /* Allows absolute positioning for children */
        }

        /* Top Center Container */
        .top-center-container {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            z-index: 10;
        }

        /* UPDATED: WAY BIGGER Top Center Rounded Square for Front.png */
        .logo-square {
            width: 320px; /* Massively increased size */
            height: 320px;
            background-color: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 2px solid rgba(255, 255, 255, 0.25);
            border-radius: 40px; /* Scaled up the rounding to match the large size */
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        }

        .logo-square img {
            width: 85%;
            height: 85%;
            object-fit: contain;
        }

        /* Oreo.net Font Styling - Scaled up to match the giant logo */
        .logo-text {
            font-size: 2.2rem;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0px 3px 6px rgba(0, 0, 0, 0.7);
            font-family: 'Trebuchet MS', sans-serif;
        }

        /* UPDATED: Clickable Main Logo locked strictly to the Top Left Edge */
        .top-left-logo-link {
            position: absolute;
            top: 0;
            left: 0;
            width: 200px; /* Nice clear size in the corner */
            height: 200px;
            z-index: 20;
            cursor: pointer;
            display: block;
        }

        .top-left-logo-link img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <!-- Top Center Area: Giant Front.png & Oreo.net Text -->
    <div class="top-center-container">
        <div class="logo-square">
            <img src="Front.png" alt="Front Logo">
        </div>
        <div class="logo-text">Oreo.net</div>
    </div>

    <!-- UPDATED: Locked to absolute 0/0 edge and links back to your domain -->
    <a href="https://oreonet.github.io/" class="top-left-logo-link">
        <img src="main.png" alt="Main Logo">
    </a>

</body>
</html>
