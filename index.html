<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>oreo.net -Join the oreos today!</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        html, body {
            margin: 0 !important;
            padding: 0 !important;
            width: 100%;
            height: 100%;
        }
        body {
            background-image: url('bg.png') !important;
            background-size: cover !important;
            background-position: center center !important;
            background-repeat: no-repeat !important;
            background-attachment: fixed !important;
            font-family: 'Montserrat', sans-serif;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .front-logo-wrapper {
            position: relative;
            width: 1400px;
            height: 560px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            border-radius: 24px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            max-width: 95vw;
        }

        .front-logo-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .centered-image-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            text-align: center;
            font-family: 'Montserrat', sans-serif;
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: 1px;
            color: #ffffff;
            text-shadow: 
                -2px -2px 0 #000,  
                 2px -2px 0 #000,
                -2px  2px 0 #000,
                 2px  2px 0 #000,
                 0px  4px 10px rgba(0, 0, 0, 0.8);
            pointer-events: none;
            z-index: 5;
        }

        /* Top Left Main Logo Link */
        .top-left-logo-link {
            position: absolute;
            top: 0;
            left: 0;
            width: 200px;
            height: 200px;
            z-index: 20;
            cursor: pointer;
            display: block;
        }

        .top-left-logo-link img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <div class="front-logo-wrapper">
        <img src="Front.png" alt="Front Logo">
        <h1 class="centered-image-text">Welcome to oreo.net</h1>
    </div>

    <!-- REDIRECT SET EXACTLY TO OREONET.GITHUB.IO -->
    <a href="oreonet.github.io/" class="top-left-logo-link">
        <img src="main.png" alt="Main Logo">
    </a>

</body>
</html>
