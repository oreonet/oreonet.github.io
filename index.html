<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oreonet Website</title>
    <style>
        /* Force styling overrides to ignore GitHub defaults */
        html, body {
            margin: 0 !important;
            padding: 0 !important;
            width: 100%;
            height: 100%;
        }
        body {
            /* Links your background image file */
            background-image: url('bg.png') !important;
            background-size: cover !important;
            background-position: center center !important;
            background-repeat: no-repeat !important;
            background-attachment: fixed !important;
            font-family: Arial, sans-serif;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative; /* Allows absolute positioning for children */
        }

        /* Top Center Container */
        .top-center-container {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            z-index: 10;
        }

        /* UPDATED: Wider container designed to fit the rectangular blue image perfectly */
        .logo-square {
            width: 480px; /* Made wider to accommodate the banner shape */
            height: 280px; /* Adjusted height for a balanced landscape box */
            background-color: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 2px solid rgba(255, 255, 255, 0.25);
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        }

        /* Let the image fill the area naturally up to its edges without chopping off the borders */
        .logo-square img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Prevents cropping or clipping the pattern layout */
            padding: 10px; /* Slight breathing room so edges look clean */
            box-sizing: border-box;
        }

        /* UPDATED: Centered text area, scaled smaller to perfectly fit the new longer phrase */
        .logo-text {
            font-size: 1.6rem; /* Scaled down slightly so it doesn't wrap awkwardly */
            font-weight: bold;
            letter-spacing: 1.5px;
            text-align: center;
            text-shadow: 0px 3px 6px rgba(0, 0, 0, 0.7);
            font-family: 'Trebuchet MS', sans-serif;
            max-width: 480px;
        }

        /* Clickable Main Logo locked strictly to the Top Left Edge */
        .top-left-logo-link {
            position: absolute;
            top: 0;
            left: 0;
            width: 200px;
            height: 200px;
            z-index: 20;
            cursor: pointer;
            display: block;
        }

        .top-left-logo-link img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <!-- Top Center Area: Wider Container with Front.png & Updated Greeting Text -->
    <div class="top-center-container">
        <div class="logo-square">
            <img src="Front.png" alt="Front Logo">
        </div>
        <div class="logo-text">Welcome to oreo.net</div>
    </div>

    <!-- Main Logo moved to the Top Left (Clickable back to repository site) -->
    <a href="https://github.io" class="top-left-logo-link">
        <img src="main.png" alt="Main Logo">
    </a>

</body>
</html>
